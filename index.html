<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060b16" />

    <!-- Primary SEO — replace the placeholder name, URL and contact details in src/data/site.js -->
    <title>Network Engineer | Reliable Network Infrastructure Portfolio</title>
    <meta
      name="description"
      content="Portfolio of a Network Engineer specialising in LAN/WAN design, routing and switching, network security, wireless deployment, and IT infrastructure support in Tanzania."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://example.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Network Engineer | Reliable Network Infrastructure Portfolio" />
    <meta
      property="og:description"
      content="Designing, securing and maintaining reliable network infrastructures that support modern businesses."
    />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:site_name" content="Network Engineer Portfolio" />
    <meta property="og:image" content="https://example.com/og-image.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Network Engineer | Reliable Network Infrastructure Portfolio" />
    <meta
      name="twitter:description"
      content="LAN/WAN design, routing and switching, network security and infrastructure support."
    />
    <meta name="twitter:image" content="https://example.com/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Your Full Name",
        "jobTitle": "Network Engineer",
        "description": "Network Engineer focused on reliable network infrastructure, routing and switching, and network security.",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "TZ"
        },
        "url": "https://example.com/",
        "email": "hello@example.com"
      }
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
